[project]
name = "pomod"
version = "0.1.0"
description = "A tiny Pomodoro daemon with a socket API. Waybar, your terminal and your AI agents are just clients."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mathis Arends", email = "mathisarends27@gmail.com" }]
keywords = ["pomodoro", "daemon", "waybar", "cli", "timer"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = ["click>=8.1"]

[project.scripts]
pomod = "pomod.daemon:main"
pomo = "pomod.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pomod"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
